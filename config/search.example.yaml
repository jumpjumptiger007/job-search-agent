# All discovery sources are disabled by default. After copying this file to
# config/search.yaml, enable at least one source before running discovery.
providers:
  - type: greenhouse
    board: example-board-token
    enabled: false
    limit: 25
  - type: lever
    company: example-company-token
    enabled: false
  # Explicit public Personio career source only; no tenant discovery or crawling.
  - type: personio
    source: https://example-company-token.jobs.personio.de
    language: en
    enabled: false
    limit: 25
bundesagentur:
  enabled: false
  limit: 25
# Public REST source; keep disabled in the reusable example configuration.
arbeitnow:
  enabled: false
  limit: 50
# Shallow, bounded discovery only. No platform-specific scraping.
webSearch:
  enabled: false
  maxQueries: 3
  maxRawCandidates: 30
  maxProcessedCandidates: 15
# Optional public LinkedIn jobs, personal use and low volume only; requires Bun when enabled.
linkedin:
  enabled: false
  limit: 5
